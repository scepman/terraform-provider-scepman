version: "2"
run:
  modules-download-mode: vendor
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - reassign
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    nakedret:
      max-func-lines: 40
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
